# ---- ChiselTraceTorture ------------------------------------------------------
#
# Exercises the uhdi_to_pdg converter against the native chiseltrace fork
# (ChiselStage(addChiselTrace=true)).  Three [CIRCT] gaps are intentional:
#   #6 dynamic memory index (mem.read/write with dynamic addr)
#   #7 Vec register with dynamic index (regs(io.sel) := ...)
#   #8 Mux with signal selector (Mux(io.cond, x, y))
# All gaps require CIRCT-level probe insertion that is not visible in UHDI;
# the converter cannot synthesise probes from FIRRTL alone.
# Five [OK] cases (combinational chain, nested when, register, assert,
# submodule) produce zero unexpected deltas.

[fixtures.ChiselTraceTorture]
scala = "ChiselTraceTorture.scala"

[[fixtures.ChiselTraceTorture.expected.pdg]]
path_regex = "/cfg/[0-9]+"
kind = "missing"
reason = "[CIRCT gaps #6-8] native chiseltrace synthesises when-block predicate nodes (pred_io_en/we/cond) and emits stmt-scope CFG entries for Vec/Mux/mem probe chains; UHDI converter sees no probes in the IR and produces a smaller cfg array"

[[fixtures.ChiselTraceTorture.expected.pdg]]
path_regex = "/edges/[0-9]+"
kind = "missing"
reason = "[CIRCT gaps #6-8] missing probe-indexed edges: (1) Vec scalarization -- native splits regs→regs.0..regs.n and emits Index edges; UHDI keeps aggregate; (2) dynamic mem index -- native inserts probe_rd_idx/probe_wr_idx and emits Index edges; UHDI has no probes; (3) Mux selector -- native inserts mux probe and emits Conditional edges; UHDI keeps plain ?: with no predicate"

[[fixtures.ChiselTraceTorture.expected.pdg]]
path_regex = "/predicates/[0-9]+"
kind = "missing"
reason = "[CIRCT gaps #6-8] native chiseltrace inserts compiler-synthesised probe signals (pred_io_en, pred_io_we, pred_io_cond) for when-block guard tracking; UHDI IR contains no probe metadata so the converter emits an empty predicates list"

[[fixtures.ChiselTraceTorture.expected.pdg]]
path_regex = "/vertices/[0-9]+"
kind = "missing"
reason = "[CIRCT gaps #6-8] native chiseltrace scalarises Vec/mem aggregates into per-element vertices (regs.0..regs.n, mem.0..mem.n) and adds probe vertices (probe_*, io_dout_MPORT, _io_dout_WIRE); UHDI keeps aggregates and has no probes, yielding fewer vertices"

# ---- HgdbTorture -------------------------------------------------------------
#
# Exercises the uhdi_to_hgdb converter against the hgdb-firrtl native baseline.
# Empirically compared 2026-05-23 after rebuilding _hgdb.so for python-3.12 (E1 fixed).
# hgdb_circt remains in _PENDING_CELLS: LLVM-16 fork hangs >300 s (E2).
#
# Table sizes:  ours vs native (hgdb-firrtl)
#   instance       : 3   vs 3    [OK]
#   breakpoint     : 69  vs 53   ours richer (native skips intermediate bp)
#   variable       : 31  vs 29   ours richer (2 extra clock entries)
#   assignment     : 28  vs 22   ours richer (6 extra sub-port connects)
#   scope          : 3   vs 0    ours only (hgdb-firrtl omits scope table)
#   context_var    : 719 vs 0    ours only (hgdb-firrtl omits context_var table)
#   annotation     : 1   vs 0    ours only (hgdb-firrtl omits annotation table)
#
# All 46 reported deltas are "missing in ours" relative to native because the
# diff runs in superset mode (checks native ⊆ ours).  The causes:
#
# G1 [CIRCT] Intermediate breakpoints absent (L80-82, sub0/sub1, 12 bp):
#   FIRRTL 1.x emits one bp per statement operand (col=18 for the LHS token),
#   CIRCT emits one bp per statement.  Native also expands _T/_T_1 tokens into
#   the full boolean expression; ours keeps CIRCT-simplified form.
# G2 [CIRCT] `!reset && 1` simplified to `!reset` (L91-93, 6 bp):
#   CIRCT constant-folds `x && 1` → `x`; FIRRTL 1.x preserves the literal.
# G3 [CIRCT] Intermediate breakpoints absent (L125, 3 bp):
#   Native emits 4 bp at col=13/21/24/31; ours emits only col=31.
# G4 [CIRCT] Condition token name mismatch for T3 (L126/131/132, 3 bp):
#   Native writes `_T_2`/`_T_3` (FIRRTL 1.x node names); ours writes `_GEN`
#   (CIRCT node name) / expanded expression.  Same logical condition, different
#   intermediate identifier.  This is the T3 gap seen from the native side.
# G5 [CIRCT] Vec register RTL name: `reg_` (native) vs `reg_0` (ours):
#   FIRRTL 1.x names the Vec element `reg_` (no index suffix); CIRCT uses
#   `reg_0`.  Affects variable and generator_variable tables (2 entries each).
# G6 [CONV] assignment.value uses dotted names (ours) vs flat (native):
#   native: `io_out`, `io_q`, `sub0.io.in`; ours: `io.out`, `io.q`, `sub0.io_in`.
#   Ours follows UHDI variable_value; native follows hgdb-firrtl naming convention.
# G7 [CONV] assignment breakpoint_key mismatches due to G4:
#   acc assignments at L126/132 have _GEN vs _T_2 in the key string, so the
#   superset check cannot find the matching native assignment row.

[fixtures.HgdbTorture]
scala = "HgdbTorture.scala"

# hgdb_circt: still pending (E2 — hgdb-circt hangs >300 s).
# hgdb_firrtl: compared empirically 2026-05-23; all 46 deltas classified below.

[[fixtures.HgdbTorture.expected.hgdb_firrtl]]
path_regex = "/breakpoint/[0-9]+"
kind = "missing"
reason = "[CIRCT G1-G4] FIRRTL 1.x emits more breakpoints than CIRCT: (G1) one bp per statement operand (col=18 intermediate) vs one per statement; (G2) preserves `!reset && 1` where CIRCT folds to `!reset`; (G3) 3 extra intermediate bp at L125; (G4) _T_2/_T_3 node names (FIRRTL 1.x) vs _GEN/expanded (CIRCT) -- same logical condition, different IR token"

[[fixtures.HgdbTorture.expected.hgdb_firrtl]]
path_regex = "/variable/[0-9]+"
kind = "missing"
reason = "[CIRCT G5] Vec register RTL name: FIRRTL 1.x emits `reg_` (no index suffix); CIRCT emits `reg_0`. Both refer to the same Vec element; naming convention differs between the two frontends"

[[fixtures.HgdbTorture.expected.hgdb_firrtl]]
path_regex = "/generator_variable/[0-9]+"
kind = "missing"
reason = "[CIRCT G5] same Vec register naming divergence as /variable: `reg_` (native) vs `reg_0` (ours)"

[[fixtures.HgdbTorture.expected.hgdb_firrtl]]
path_regex = "/assignment/[0-9]+"
kind = "missing"
reason = "[CONV G6+G7] two converter gaps: (G6) assignment.value uses UHDI dotted names (io.out, io.q, sub0.io_in) where native uses flat hgdb-firrtl convention (io_out, io_q, sub0.io.in); (G7) acc assignment breakpoint_key contains _GEN (CIRCT) vs _T_2/_T_3 (FIRRTL 1.x) so the superset check cannot match the native row"
